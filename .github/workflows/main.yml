name: Paramlib Build
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: master
      - uses: oven-sh/setup-bun@v1
      - run: zig build install -Doptimize=ReleaseFast -Dvscode=true
      - uses: actions/upload-artifact@v4
        with:
          name: paramlib-${{ matrix.os }}
          path: zig-out/bin/paramlib${{ runner.os == 'Windows' && '.exe' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: paramlib-lsp-${{ matrix.os }}
          path: zig-out/bin/paramlib-lsp${{ runner.os == 'Windows' && '.exe' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: paramkit-0.0.2.vsix
          path: zig-out/vscode/paramkit-0.0.2.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: paramlib-lsp.wasm
          path: zig-out/wasm/paramlib-lsp.wasm
