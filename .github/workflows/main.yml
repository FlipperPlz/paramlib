name: Paramlib Build
on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: master
      - run: zig build install -Doptimize=ReleaseFast
      - uses: actions/upload-artifact@v7
        with:
          name: paramlib
          path: zig-out/bin/
